# The Python wheels Tin Hat Server ships: aiohttp (the manager's, the names service's and the relay's web stack) and
# what it needs, for Debian 13's Python 3.13 on amd64 and arm64, plus pure-Python builds of the same versions for any
# other Python 3.10+ (install.sh on Ubuntu 24.04: 3.12), and pip, which installs them (run from its own wheel, never
# installed). Debian's python3-aiohttp 3.11.16 has 2026 advisories Debian won't fix (M15); these replace it.
#
# One file per line: NAME VERSION SHA256 URL. build/wheels.py fetch downloads exactly these at build time and refuses
# any file whose sha256 differs; servers check them again and install them offline into a venv
# (`pip install --no-index --require-hashes`, tinhat/pyenv.py). Nothing on a server ever asks PyPI for anything.
#
# Pinned 2026-10-26: aiohttp 3.14.5 (>= 3.14.4, which fixes every advisory pip-audit lists against 3.11.16; OSV: none
# against 3.14.5), its dependencies at versions at least two weeks old (multidict 7.1.0, not 7.2.x of 10-24), pip
# 26.2.1 (not 26.2.2 of 10-20). Changing a version: docs/RELEASING.md, "aiohttp and its wheels".
