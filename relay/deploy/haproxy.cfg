# Tin Hat relay: HTTPS by name, passed through untouched (written by the relay's setup; @PUBLIC_IP@ filled in).
# HAProxy only reads the name in the TLS hello (SNI) and connects the bytes to that server's tunnel address. It never
# holds a certificate or key for any server, so it can't read what goes through. Per-connection logs are off: the
# relay keeps no record of who connected to which server.
global
	log /dev/log local0 warning
	maxconn 20000
	user haproxy
	group haproxy
	daemon
	stats socket /run/haproxy/admin.sock mode 600 level admin

defaults
	mode tcp
	log global
	option dontlognull
	timeout connect 5s
	timeout client 1h
	timeout server 1h
	timeout client-fin 30s
	timeout server-fin 30s

frontend tinhat_https
	bind @PUBLIC_IP@:443
	# A little protection against floods: at most 60 new connections per 10 s from one address.
	stick-table type ip size 200k expire 60s store conn_rate(10s)
	tcp-request connection track-sc0 src
	tcp-request connection reject if { sc0_conn_rate gt 60 }
	tcp-request inspect-delay 5s
	tcp-request content reject unless { req.ssl_hello_type 1 }
	tcp-request content set-var(sess.home) req.ssl_sni,lower,map(/etc/tinhat-relay/sni.map)
	tcp-request content reject unless { var(sess.home) -m found }
	tcp-request content set-dst var(sess.home)
	default_backend tinhat_home

backend tinhat_home
	# 0.0.0.0:0 = the address set above, same port (443). PROXY v2 hands the server the friend's real address; the
	# server accepts that header only from this relay's tunnel address.
	server home 0.0.0.0:0 send-proxy-v2
