# Tin Hat Server for Windows: how WSL starts this server.
# (Added by windows/build-rootfs.sh; the VM image has no such file.)

[boot]
# The server is a set of systemd services (Docker, the manager, mDNS), exactly as in the VM image.
systemd = true

[user]
default = root

[network]
# The server names itself: "tinhat" until setup, then the name chosen in setup (tinhat-wsl-boot.service sets it at
# every start, before mDNS). Without this WSL would use the PC's own name, which Windows already announces itself.
hostname = tinhat
# The manager owns /etc/hosts (it adds the server's name there).
generateHosts = false
# DNS comes from Windows: WSL writes /etc/resolv.conf, systemd-resolved reads it.
generateResolvConf = true

[interop]
# The server never starts Windows programs and doesn't see Windows' PATH.
enabled = false
appendWindowsPath = false

[automount]
# The server doesn't need the PC's drives, so it can't see them.
enabled = false
mountFsTab = false

[gpu]
enabled = false

[general]
guiApplications = false
