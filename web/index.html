<!doctype html>
<html lang="en" data-theme="oled">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tin Hat" />
    <title>Tin Hat</title>
    <link rel="icon" href="./appicon/tinhat-256.png" />
    <link rel="apple-touch-icon" href="./appicon/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <script>
      // Before any bundle: the theme shown last (pref "theme", the theme store's mirror) so the first paint is already
      // right — the built-ins through the generated rules below; any other theme from the boot variables the runtime
      // cached for it (pref "theme-boot" = {id, variant, vars}, ui/themes.ts).
      try {
        var t = localStorage.getItem("tinhat.pref.theme");
        var de = document.documentElement;
        if (t === "goose") de.setAttribute("data-theme", "goose");
        else if (t && t !== "oled") {
          var b = JSON.parse(localStorage.getItem("tinhat.pref.theme-boot") || "null");
          if (b && b.id === t && b.vars) {
            for (var k in b.vars) if (k.indexOf("--th-") === 0) de.style.setProperty(k, b.vars[k]);
            de.setAttribute("data-theme", t);
            if (b.variant === "light") de.style.colorScheme = "light";
          }
        }
      } catch (e) {}
    </script>
    <style>
      /* The static "Starting Tin Hat" card (StartupWindow.qml, "Starting up" 5 %) — painted before
         the app bundle loads; the React Startup takes over the same geometry. Colours: the element tokens of the
         React Startup (src/app/Startup.module.css) and the page's window.bg — their values for each built-in theme
         are GENERATED below (tools/modular/gen-theme-vars.mjs), picked by the data-theme the script above set. */
      /* ==== GENERATED by tools/modular/gen-theme-vars.mjs — do not edit by hand ==== */
      /* The 13 role/token variables this page reads, with their web values per built-in theme (resolveForApp(…, "web")). */
      :root {
        --th-startup-backdrop-bg: #000000;
        --th-startup-bg: #000000;
        --th-startup-border: #222222;
        --th-startup-fg: #e0e0e0;
        --th-startup-hint-fg: #aaaaaa;
        --th-startup-mark-glow: #1e6a76;
        --th-startup-progress-fill: #1e6a76;
        --th-startup-progress-highlight: rgba(255, 255, 255, 0.22);
        --th-startup-progress-track: #222222;
        --th-startup-stripe-end-fill: #3cbad0;
        --th-startup-stripe-start-fill: #1e6a76;
        --th-startup-wash-glow: #3cbad0;
        --th-window-bg: #000000;
      }
      html[data-theme="goose"] {
        --th-startup-backdrop-bg: #1a0a1a;
        --th-startup-bg: #1a0a1a;
        --th-startup-border: #4a2050;
        --th-startup-fg: #f0e0f0;
        --th-startup-hint-fg: #c8a0c8;
        --th-startup-mark-glow: #b0508c;
        --th-startup-progress-fill: #b0508c;
        --th-startup-progress-highlight: rgba(255, 255, 255, 0.22);
        --th-startup-progress-track: #4a2050;
        --th-startup-stripe-end-fill: #e87cc0;
        --th-startup-stripe-start-fill: #b0508c;
        --th-startup-wash-glow: #e87cc0;
        --th-window-bg: #1a0a1a;
      }
      /* ==== END GENERATED ==== */
      html, body { height: 100%; margin: 0; background: var(--th-window-bg); }
      /* #root stays black in every theme (step 1a keeps today's pixels: the Goose rule never listed #root, so the
         sign-in screen shows it as a 21 px black strip right and bottom) — a parity item, not a token */
      #root { height: 100%; margin: 0; background: #000; }
      .th-boot {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--th-startup-backdrop-bg);
        font-family: "Noto Sans", system-ui, "Segoe UI", sans-serif; }
      .th-boot > div { position: relative; width: 320px; height: 440px; margin-top: -60px; overflow: hidden; background: var(--th-startup-bg); }
      .th-boot i { position: absolute; display: block; }
      .th-boot .w { left: 50%; top: -70px; width: 360px; height: 360px; margin-left: -180px; border-radius: 50%; opacity: .14; background: linear-gradient(var(--th-startup-wash-glow), transparent); }
      .th-boot .f { inset: 0; box-shadow: inset 0 0 0 1px var(--th-startup-border); }
      .th-boot .s { left: 1px; right: 1px; top: 1px; height: 3px; background: linear-gradient(90deg, var(--th-startup-stripe-start-fill), var(--th-startup-stripe-end-fill)); }
      .th-boot .m { left: 96px; top: 46px; width: 128px; height: 128px; }
      .th-boot .g { left: -25.6px; top: -25.6px; width: 179.2px; height: 179.2px; border-radius: 50%; opacity: .35; background: linear-gradient(var(--th-startup-mark-glow), transparent); }
      .th-boot svg { position: relative; display: block; }
      .th-boot .t { left: 0; right: 0; top: 192px; text-align: center; color: var(--th-startup-fg); font-size: 26px; line-height: 36px; font-weight: 700; font-style: normal; }
      .th-boot .v { left: 0; right: 0; top: 230px; text-align: center; color: var(--th-startup-hint-fg); font-size: 12px; line-height: 17px; font-style: normal; }
      .th-boot .k { left: 44px; top: 318px; width: 232px; height: 6px; border-radius: 3px; background: var(--th-startup-progress-track); overflow: hidden; }
      .th-boot .k b { display: block; width: 12px; height: 100%; border-radius: 3px; background: var(--th-startup-progress-fill); }
      .th-boot .k u { position: absolute; top: 0; left: 0; width: 90px; height: 100%; background: linear-gradient(90deg, transparent, var(--th-startup-progress-highlight), transparent); }
      .th-boot .x { left: 24px; right: 24px; top: 338px; text-align: center; color: var(--th-startup-fg); font-size: 15px; line-height: 20px; font-style: normal; }
      .th-boot .p { left: 0; right: 0; bottom: 16px; text-align: center; color: var(--th-startup-hint-fg); font-size: 11px; line-height: 15px; font-style: normal; }
    </style>
  </head>
